  - date: "2025"
    title: How Mg ions move through solid electrolytes
    body: A multi-institution team used ultrahigh-field ²⁵Mg NMR and first-principles calculations to reveal Mg-ion conduction in antiperovskite solid electrolytes (J. Am. Chem. Soc.).
    url: https://doi.org/10.1021/jacs.5c07442
    status: draft
